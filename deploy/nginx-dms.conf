# nginx site for the DMS: serves the React build (dist/) and proxies the API to Flask on one origin.
#
# Install (Ubuntu):
#   sudo mkdir -p /etc/nginx/snippets
#   sudo cp security-headers.conf /etc/nginx/snippets/dms-security-headers.conf
#   sudo cp proxy.conf /etc/nginx/snippets/dms-proxy.conf
#   sudo cp nginx-dms.conf /etc/nginx/sites-available/dms
#   sudo ln -sf /etc/nginx/sites-available/dms /etc/nginx/sites-enabled/dms
#   sudo nginx -t && sudo systemctl reload nginx
# (RHEL/Rocky: copy nginx-dms.conf to /etc/nginx/conf.d/dms.conf instead.)
#
# Adjust: listen port, root (folder with index.html from `npm run build`) and the Flask address
# (DMS_HOST:DMS_PORT in DMS-BE/.env). Set DMS_TRUSTED_PROXIES=1 in DMS-BE/.env.

# Fallback security headers for the proxied Flask locations (see proxy.conf). Each is set only when
# Flask did not send that header itself, so route-specific CSPs (previews, email bodies) are never
# doubled, while responses nginx generates on its own (502/504 when Flask is down or slow) still carry
# them (ZAP: "Content Security Policy (CSP) Header Not Set" on /api/v1/... error responses).
map $upstream_http_content_security_policy $dms_fallback_csp {
    ""      "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; font-src 'self' data:; media-src 'self'; connect-src 'self'; frame-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self' https://accounts.google.com; frame-ancestors 'self'";
    default "";
}
map $upstream_http_x_frame_options $dms_fallback_xfo                { "" "SAMEORIGIN"; default ""; }
map $upstream_http_x_content_type_options $dms_fallback_nosniff     { "" "nosniff"; default ""; }
map $upstream_http_referrer_policy $dms_fallback_referrer           { "" "same-origin"; default ""; }
map $upstream_http_permissions_policy $dms_fallback_permissions     { "" "camera=(), microphone=(), geolocation=(), payment=(), usb=()"; default ""; }

upstream dms_backend {
    server 127.0.0.1:8080;
}

server {
    listen 8081;
    server_name _;

    # Send "Server: nginx" without the version number (VAPT: server version disclosure).
    server_tokens off;

    root /var/www/dms-fe;
    index index.html;

    # Uploads: keep at least DMS_MAX_REQUEST_MB (default 1024 MB). nginx's default is only 1 MB.
    client_max_body_size 1024m;

    # ---------------------------------------------------------------- Flask (API and callbacks)
    # Flask sends its own security headers, including route-specific CSPs; proxy.conf only fills in
    # any that are missing (e.g. on nginx's own 502/504 pages).
    location /api/                 { proxy_pass http://dms_backend; include /etc/nginx/snippets/dms-proxy.conf; }
    location /auth/                { proxy_pass http://dms_backend; include /etc/nginx/snippets/dms-proxy.conf; }
    location /gmail/oauth2callback { proxy_pass http://dms_backend; include /etc/nginx/snippets/dms-proxy.conf; }
    location /static/              { proxy_pass http://dms_backend; include /etc/nginx/snippets/dms-proxy.conf; }

    # ---------------------------------------------------------------- React app (static files)
    # Hashed build files never change: cache them for a long time.
    location /assets/ {
        include /etc/nginx/snippets/dms-security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Everything else: a real file (logo.svg, ...) or index.html, so the app can handle routes such as
    # /folders/12 itself. index.html is revalidated on every load so a new build is picked up at once.
    location / {
        include /etc/nginx/snippets/dms-security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri /index.html;
    }
}

# Proxy settings for the Flask locations in nginx-dms.conf.
# Install: sudo cp proxy.conf /etc/nginx/snippets/dms-proxy.conf

# $http_host is the host the browser used, including a non-default port (e.g. 10.1.190.43:8081),
# so Flask builds redirect and OAuth callback URLs that point back to this site.
# No X-Forwarded-Port: Flask would then add ":443"/":80" to callback URLs, which Google rejects.
proxy_set_header Host              $http_host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host  $http_host;

# Large uploads and downloads: stream them instead of buffering, and allow time for slow links.
proxy_request_buffering off;
proxy_read_timeout 600s;
proxy_send_timeout 600s;

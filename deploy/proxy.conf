# Proxy settings for the Flask locations in nginx-dms.conf.
# Install: sudo cp proxy.conf /etc/nginx/snippets/dms-proxy.conf

# $http_host is the host the browser used, including a non-default port (e.g. 10.1.190.43:8081),
# so Flask builds redirect and OAuth callback URLs that point back to this site.
# No X-Forwarded-Port: Flask would then add ":443"/":80" to callback URLs, which Google rejects.
proxy_set_header Host              $http_host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host  $http_host;

# Large uploads and downloads: stream them instead of buffering, and allow time for slow links.
proxy_request_buffering off;
proxy_read_timeout 600s;
proxy_send_timeout 600s;

# Security headers on responses that lack them, mainly nginx's own 502/504 pages when Flask is down.
# An empty value (Flask already sent the header) means nginx adds nothing. Maps: nginx-dms.conf.
add_header Content-Security-Policy $dms_fallback_csp always;
add_header X-Frame-Options $dms_fallback_xfo always;
add_header X-Content-Type-Options $dms_fallback_nosniff always;
add_header Referrer-Policy $dms_fallback_referrer always;
add_header Permissions-Policy $dms_fallback_permissions always;

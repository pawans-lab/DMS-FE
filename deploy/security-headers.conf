# Security headers for the React app's static files (index.html, /assets/*, logo.svg, ...).
# Included only by the static locations in nginx-dms.conf: Flask already sends these headers (and
# route-specific CSPs for previews and email bodies) on /api, /auth and /static responses, and a
# second Content-Security-Policy added by nginx would be enforced on top of them.
#
# Keep in line with the backend defaults in DMS-BE/dms/config.py (DEFAULT_CONTENT_SECURITY_POLICY).
# "always" also adds the headers to error responses (404, 500, ...).
#
# If the app calls the API on another origin (VITE_API_BASE set at build time), add that origin to
# connect-src, for example: connect-src 'self' https://dms-api.example.com;

add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; font-src 'self' data:; media-src 'self'; connect-src 'self'; frame-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self' https://accounts.google.com; frame-ancestors 'self'" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "same-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;

# Enable only when the site is served over HTTPS (browsers then refuse plain HTTP for a year):
# add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
